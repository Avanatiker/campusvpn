[package]
name = "campusvpn"
version = "0.2.0"
edition = "2024"
description = "Lightweight Linux VPN client with system tray and auto-connect, compatible with eduVPN and Let's Connect! servers"
license = "GPL-3.0-or-later"
repository = "https://github.com/Avanatiker/campusvpn"
readme = "README.md"
keywords = ["vpn", "wireguard", "openvpn", "gtk4", "tray"]
categories = ["network-programming", "gui"]
rust-version = "1.92"

[features]
# Fills the UI with made-up data instead of connecting, for screenshots.
demo = []

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_5"] }
anyhow = "1.0.104"
async-channel = "2.5.0"
env_logger = "0.11.11"
glib-unix = "0.22"
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_14"] }
ipnet = "2.12.2"
ksni = { version = "0.3.6", default-features = false, features = ["async-io", "blocking"] }
libloading = "0.9.0"
log = "0.4.34"
secret-service = { version = "5.2.0", features = ["rt-async-io-crypto-rust"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uuid = { version = "1.28.0", features = ["v4"] }
zbus = { version = "5.19.0", default-features = false, features = ["blocking-api", "async-io"] }

[profile.release]
lto = true
strip = true
